# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# A new entry (no prior Palomar registration of this content).
version: "v0.4"

project:
  name: "Hypercharge is not an element of sl(4) + sl(2) acting on (4,2) + (4bar,1) + (4bar,1): the Standard-Model hypercharge on one generation of Pati-Salam content lies outside su(4) + su(2)_L; the commutant of colour in sl(4) is the B - L line; Y = (1/2)(B - L) + T_3R"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of five statements of finite
    linear algebra over a field K (characteristic zero assumed on statements
    1, 3, 4, 5; load-bearing on 3, 4, 5, a convenience of the recorded proof
    on 1 - fidelity (c)). This is a kernel-checked instance of textbook
    representation theory (the Pati-Salam decomposition), not a new theorem:
    the sharpest statement is a 4 x 4 trace computation, and the entry's value
    is that the non-embedding, the commutant and the decomposition
    Y = (1/2)(B - L) + T_3R are fixed for exactly this content and
    normalisation so that they can be cited exactly. The Lie algebra
    gl_4(K) + gl_2(K) acts on V = (K^4 (x) K^2) + K^4 + K^4 by (X, Y) |->
    (X (x) 1 + 1 (x) Y, -X^T, -X^T): the defining representation tensored
    with the defining representation on the first summand and the dual of
    the defining representation of gl_4 on each of the two remaining
    summands, which carry the SAME matrix. This is the one-generation
    Pati-Salam content (4,2) + (4bar,1) + (4bar,1) of su(4) + su(2)_L - the
    restriction to su(4) + su(2)_L of the Pati-Salam content (4,2,1) +
    (4bar,1,2) of su(4) + su(2)_L + su(2)_R, the two (4bar,1) copies being the
    two components of the su(2)_R doublet: the left-handed doublets
    (u, d, nu, e)_L, the conjugate up-type copy (u_R, nu_R)^c and the
    conjugate down-type copy (d_R, e_R)^c, colour at indices 0, 1, 2 and the
    lepton at index 3. The fixed operator is the Standard-Model hypercharge
    (extended by a right-handed neutrino of hypercharge 0, which the content
    contains), normalisation Q = T_3 + Y: Y_L = diag(1/6, 1/6, 1/6, -1/2) (x)
    1_2, Y_uc = diag(-2/3, -2/3, -2/3, 0), Y_dc = diag(1/3, 1/3, 1/3, 1).
    (1) For ALL X in gl_4 and Y in gl_2 (traceless or not): not (rhoL X Y =
    Y_L and rhoR X = Y_uc and rhoR X = Y_dc) - the two conjugate copies
    receive one matrix -X^T and Y_uc != Y_dc. (2) If X in gl_4 has trace 0
    and commutes with every traceless 3 x 3 matrix embedded in the colour
    block, then X = a diag(1, 1, 1, -3) for some a: the commutant of sl_3 in
    sl_4 is the B - L line (no characteristic assumption). (3) If Y in gl_2
    has trace 0 and commutes with every traceless 2 x 2 matrix, then Y = 0.
    (4) Y_L = (1/2)(B - L) (x) 1, Y_uc = (1/2) rhoR(B - L) - (1/2) 1, Y_dc =
    (1/2) rhoR(B - L) + (1/2) 1, with B - L = diag(1/3, 1/3, 1/3, -1):
    hypercharge is half of B - L plus a generator acting by 0 on the
    left-handed block and by the opposite scalars -1/2, +1/2 on the two
    right-handed conjugate copies - T_3R on this content. (5) For every
    traceless X in gl_4: rhoR X != Y_uc and rhoR X != Y_dc - each conjugate
    copy alone excludes hypercharge from sl_4, because trace Y_uc = -2,
    trace Y_dc = 2 and trace(-X^T) = 0; the two blocks have opposite traces,
    so the obstruction is invisible to the total trace over V and is seen
    summand by summand. Statement 5 is the sharpest form of the
    non-embedding and needs neither the commutant nor the pairing of the
    copies; statements 2-4 record the structure behind it (that no multiple
    of diag(1,1,1,-3) restricts to either hypercharge block follows at once
    and is proved in Solution.lean as a non-compared lemma). The mathematics
    is textbook representation theory of the Pati-Salam decomposition
    (Pati-Salam 1974; Georgi-Glashow 1974; Slansky 1981; Baez-Huerta 2010
    section 3.3, the source formalised here in Lie-algebra form): the
    relation Y = (1/2)(B - L) + T_3R and the need for a generator outside
    su(4) + su(2)_L - T_3R of su(2)_R, the reason Pati and Salam include it -
    are standard, and the entry claims only the kernel-checked instance for
    this content, these operators and this normalisation. Application (no
    compared statement asserts it): in the author's canon the Galois groups
    S_3 and S_4 of x^3 - x - 1 and x^4 - x - 1 are theorems and reading them
    as the Weyl groups of su(3) + su(4) is the theory's identification;
    given its canonical modulus rule, exactly one su(2)_L is forced; no
    abelian factor outside these is derived. The statements locate
    hypercharge relative to that algebra: its B - L half lies inside the
    derived su(4) (statement 2, the colour commutant), while hypercharge as a
    whole cannot be carried by su(4) + su(2)_L on this content (statements 1
    and 5), so a T_3R-type generator on right-handed fields must be gauged
    in addition (statement 4); whether it is gauged as a u(1) or as the
    Cartan element of an su(2)_R is not decided by any statement here. The
    question is live because a shepherding committee (Douglas, Gross, Jaffe,
    Klebanov, Nekrasov; KITP, statements of October 2026 and 3 November 2026)
    holds custody of a claimed existence proof, produced by an OpenAI model,
    of quantum Yang-Mills theory "including coupling to fermions" (first
    statement) and is checking "the Lean proof of the existence of pure
    Yang-Mills theory" for release (second statement); the KITP working-group
    page, not the signed statements, describes the larger object as related
    to "the existence of quantum chromodynamics and completions of the
    Standard Model"; OpenAI's announcement describes the result as containing
    gauge fields and fermions in four dimensions and as pertaining to "the
    simplest grand unified theory that includes the gauge fields and
    fermions of the Standard Model", without naming that theory. For any
    model whose gauge algebra contains su(4) + su(2)_L acting on the
    one-generation Pati-Salam content (4,2) + (4bar,1) + (4bar,1), the
    statements record in Lie-algebra form the textbook fact that hypercharge
    needs a generator outside that algebra - in the Pati-Salam model, T_3R of
    su(2)_R. They are not derived from, and say nothing about the correctness
    or the content of, the announced proof, whose artifacts are unreleased
    as of 2026-11-05.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.RT / 17B10 (representations of Lie algebras: commutants, the dual
  # representation), 15A27 (commutativity of matrices: statements 2-3), 15A30
  # (algebraic systems of matrices). hep-ph and
  # math-ph / 81R40 (symmetry breaking), 81V22 (unified quantum theories) because
  # the application section states the physical reading as a cited application;
  # no compared statement is a physical claim.
  arxiv: ["math.RT", "hep-ph", "math-ph"]
  msc2020: ["17B10", "15A27", "15A30", "81R40", "81V22"]

sources:
  - title: "The algebra of grand unified theories"
    authors:
      - "John C. Baez"
      - "John Huerta"
    id: "Bulletin of the American Mathematical Society 47 (2010) 483-552"
    # DOI 10.1090/S0273-0979-10-01294-2; arXiv:0904.1556 (v2, 1 May 2010). Section 3.3
    # read 2026-11-05; Crossref-verified.
    type: "paper"
    location: "https://doi.org/10.1090/S0273-0979-10-01294-2"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      THE SOURCE THIS ENTRY FORMALISES, in Lie-algebra form on explicit
      matrices. Section 3.3 embeds U(1) x SU(2) x SU(3) into SU(2) x SU(2) x
      SU(4) with the U(1) acting as diag(alpha, alpha, alpha, alpha^-3) in
      SU(4) together with a twist k on the right-handed SU(2), records that
      the SU(4) factor alone (k = 0) gives the wrong right-handed
      hypercharges, and that all hypercharges match for k = 3 (the paper's
      hypercharge is twice this entry's: Q = I_3 + Y/2). Statements 1 and 5
      are the Lie-algebra form of "the SU(4) factor alone fails on the
      right-handed particles"; statement 2 is the commutant that makes
      diag(alpha, alpha, alpha, alpha^-3) the only candidate; statement 4 is
      the relation Y = (1/2)(B - L) + T_3R on this content; statement 3 is
      elementary. The paper
      works at the group level and takes the full Pati-Salam group as given;
      the entry proves the matrix statements for the specific content,
      operators and normalisation named in the description, over a field of
      characteristic zero, and claims nothing beyond that kernel-checked
      instance. No prior formalization of statements 1, 2 or 5 was found in
      the search recorded in README 'Prior art' (2026-11-05: Mathlib at the
      pinned revision 065356127b1d; Physlib master 69f7d2a7, which formalises
      the Standard-Model hypercharge assignments and the B - L and Y charge
      vectors but has the Pati-Salam embedding only as an informal definition
      and no sl_4 statement; the openai/math catalogue at commit 42907c9e of
      2026-10-26; the Palomar registry; Zenodo 10.5281/zenodo.19910097, a
      native_decide table check). Statement 3 is a corollary of Mathlib's
      Matrix.mem_range_scalar_of_commute_single.
    license: "unknown"
  - title: "Lepton number as the fourth 'color'"
    authors:
      - "Jogesh C. Pati"
      - "Abdus Salam"
    id: "Physical Review D 10 (1974) 275-289"
    # DOI 10.1103/PhysRevD.10.275; Crossref-verified 2026-11-05. The original not
    # re-read for this entry; cited from the standard literature.
    type: "paper"
    location: "https://doi.org/10.1103/PhysRevD.10.275"
    relationship: "background"
    note: >-
      Background: the su(4) with the lepton as the fourth colour, the content
