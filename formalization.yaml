  - id: "https://github.com/leanprover-community/physlib (formerly HEPLean/PhysLean), master 69f7d2a75fabdb848683f8141b4ce718e71e446b, read 2026-11-05"
    relationship: "other"
    note: >-
      Independent and not used. Physlib formalises the Standard-Model hypercharge
      assignments as representations of SU(3) x SU(2) x U(1) on each fermion species
      (Physlib.Particles.StandardModel.Fermions.*, e.g. UpSinglet.repGaugeGroupI with
      U(1) exponent 4, LeptonDoublet.repGaugeGroupI with exponent -3) and proves the
      hypercharge and B - L charge vectors SMRHN.PlusU1.Y1 = (1,-4,2,-3,6,0),
      SMRHN.PlusU1.BL1 = (1,-1,-1,-3,3,3) anomaly-free; its Pati-Salam module has the
      embedding SU(3) x SU(2) x U(1) -> SU(4) x SU(2) x SU(2), (h, g, alpha) |->
      (blockdiag(alpha h, alpha^-3), g, diag(alpha^3, alpha^-3)), only as an
      informal_definition (PatiSalam.inclSM; no Lean term, no theorem). It has no
