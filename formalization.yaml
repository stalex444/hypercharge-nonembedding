      colour, all taken from the standard literature. No statement of the
      paper is a compared statement.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Unity of All Elementary-Particle Forces"
    authors:
      - "Howard Georgi"
      - "Sheldon L. Glashow"
    id: "Physical Review Letters 32 (1974) 438-441"
    # DOI 10.1103/PhysRevLett.32.438; Crossref-verified 2026-11-05.
    type: "paper"
    location: "https://doi.org/10.1103/PhysRevLett.32.438"
    relationship: "background"
    note: >-
      Background: the hypercharge assignments and the normalisation Q = T_3 +
      Y used for the fixed operators Y_L, Y_uc, Y_dc, and the observation that
      hypercharge is traceless over a generation. No statement of the paper is
      a compared statement.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Group theory for unified model building"
    authors:
      - "Richard Slansky"
    id: "Physics Reports 79 (1981) 1-128"
    # DOI 10.1016/0370-1573(81)90092-2; Crossref-verified 2026-11-05. The tables
    # cited from the standard literature.
    type: "paper"
    location: "https://doi.org/10.1016/0370-1573(81)90092-2"
    relationship: "background"
    note: >-
      Branching rules for SO(10) containing SU(4) x SU(2) x SU(2) (the
      Pati-Salam decomposition) in tabulated form. Background only; the entry
      formalises no table and no statement of the review is a compared
