# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# A new entry (no prior Palomar registration of this content).
version: "v0.4"

project:
  name: "Hypercharge is not an element of sl(4) + sl(2) acting on (4,2) + (4bar,1) + (4bar,1): the Standard-Model hypercharge on one generation of Pati-Salam content lies outside su(4) + su(2)_L; the commutant of colour in sl(4) is the B - L line; Y = (1/2)(B - L) plus a T_3-type generator"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of seven statements of finite
    linear algebra over a field K (characteristic zero where a numeral must be
    nonzero). The Lie algebra gl_4(K) + gl_2(K) acts on V = (K^4 (x) K^2) + K^4
    + K^4 by (X, Y) |-> (X (x) 1 + 1 (x) Y, -X^T, -X^T): the defining
    representation tensored with the defining representation on the first
    summand and the dual of the defining representation of gl_4 on each of the
    two remaining summands, which carry the SAME matrix. This is the
    one-generation Pati-Salam content (4,2) + (4bar,1) + (4bar,1) of
    su(4) + su(2)_L: the left-handed doublets (u, d, nu, e)_L, the conjugate
    up-type copy (u_R, nu_R)^c and the conjugate down-type copy (d_R, e_R)^c,
    colour at indices 0, 1, 2 and the lepton at index 3. The fixed operator is
    the Standard-Model hypercharge, normalisation Q = T_3 + Y: Y_L = diag(1/6,
    1/6, 1/6, -1/2) (x) 1_2, Y_uc = diag(-2/3, -2/3, -2/3, 0), Y_dc = diag(1/3,
    1/3, 1/3, 1). (1) For ALL X in gl_4 and Y in gl_2 (traceless or not): not
    (rhoL X Y = Y_L and rhoR X = Y_uc and rhoR X = Y_dc) - the two conjugate
    copies receive one matrix -X^T and Y_uc != Y_dc. (2) If X in gl_4 has
    trace 0 and commutes with every traceless 3 x 3 matrix embedded in the
    colour block, then X = a diag(1, 1, 1, -3) for some a: the commutant of
    sl_3 in sl_4 is the B - L line (no characteristic assumption). (3) If Y in
    gl_2 has trace 0 and commutes with every traceless 2 x 2 matrix, then
    Y = 0. (4) For every a, rhoR (a diag(1,1,1,-3)) equals neither Y_uc nor
    Y_dc: the commutant acts by one scalar where hypercharge needs two. (5)
    Y_L = (1/2)(B - L) (x) 1, Y_uc = (1/2) rhoR(B - L) - (1/2) 1, Y_dc = (1/2)
    rhoR(B - L) + (1/2) 1, with B - L = diag(1/3, 1/3, 1/3, -1): hypercharge
    is half of B - L plus a generator acting by 0 on the left-handed block and
    by the opposite scalars -1/2, +1/2 on the two right-handed conjugate
    copies. (6) The rational identity -(2/3) (3 (8 (1/2)^2)) = -4: the
    arithmetic of the one-loop coefficient b_0 = -(2/3) sum_Weyl q^2 of an
    abelian gauge factor for eight right-handed Weyl fermions of charge +-1/2
    per generation and three generations; the formula is a stated physics
    input and is not formalised, only its arithmetic. (7) For every traceless
    X in gl_4: rhoR X != Y_uc and rhoR X != Y_dc - each conjugate copy alone
    excludes hypercharge from sl_4, because trace Y_uc = -2, trace Y_dc = 2
    and trace(-X^T) = 0; the two blocks have opposite traces, so the
    obstruction is invisible to the total trace over V and is seen summand by
    summand. Statement 7 is the sharpest form of the non-embedding and needs
    neither the commutant nor the pairing of the copies; statements 2-5
    record the structure behind it. The mathematics is textbook
    representation theory of the Pati-Salam decomposition (Pati-Salam 1974;
    Georgi-Glashow 1974; Slansky 1981): the relation Y = (1/2)(B - L) + T_3R
    and the need for a generator outside su(4) + su(2)_L are standard, and
    the entry claims only the kernel-checked instance for this content, these
    operators and this normalisation. Application (no compared statement
    asserts it): in the author's canon the non-abelian gauge algebra
    su(3) + su(4) + su(2)_L is derived and no abelian factor is; the
    statements show that the Standard-Model hypercharge cannot be carried by
    that algebra on this content, so a T_3-type generator on right-handed
    fields must be gauged in addition; whether it is a u(1) or the Cartan
    element of an su(2)_R is not decided by any statement here. The question
    is live because a shepherding committee (Douglas, Gross, Jaffe, Klebanov,
    Nekrasov; KITP, October and November 2026) is preparing the release of a
    claimed existence proof of quantum Yang-Mills theory and, later, of QCD
    and completions of the Standard Model built on gauge fields and fermions
    in four dimensions; the statements here are a constraint any such
    completion built on su(4) + su(2)_L must satisfy, not a consequence of or
    support for that proof, whose artifacts are unreleased as of 2026-11-05.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.RT / 17B10 (representations of Lie algebras: commutants, the dual
  # representation), 15A30 (algebraic systems of matrices), 20G05 (representation
  # theory for linear algebraic groups: the Pati-Salam decomposition). hep-ph and
  # math-ph / 81R40 (symmetry breaking), 81V22 (unified quantum theories) because
  # the application section states the physical reading as a cited application;
  # no compared statement is a physical claim.
  arxiv: ["math.RT", "hep-ph", "math-ph"]
  msc2020: ["17B10", "15A30", "20G05", "81R40", "81V22"]

