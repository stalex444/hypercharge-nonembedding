fidelity:
  divergences: >-
    (a) The Lie algebras enter as matrix spaces: statement 1 is stated for
    ALL X in gl_4 and Y in gl_2 (no tracelessness), which is stronger than the
    sl_4 + sl_2 statement in the title and contains it; statements 2, 3 and 7
    carry trace-zero hypotheses explicitly. (b) The "action" is the explicit
    matrix formula (X, Y) |-> (X (x) 1 + 1 (x) Y, -X^T, -X^T); no Lie-algebra
    structure (brackets, representation axioms) is formalised, because none
    is needed for the statements. (c) The field K is arbitrary with
    [CharZero K] where a numeral must be nonzero (statements 1, 3, 4, 5, 7);
    statement 2 holds over any field; in characteristic 3 statement 1 is
    false (1/3 = 0 makes Y_uc = Y_dc), so the assumption is load-bearing. (d)
    Statement 6 is a rational identity in Q, not a statement about any
    gauge theory; the physics formula it instantiates is cited, not proved.
    (e) The commutant statements 2 and 3 quantify over traceless matrices
    commuting with every traceless test matrix; the proofs use finitely many
    test matrices (the elementary matrices and two diagonal differences), as
    recorded in Solution.lean. (f) The physical reading in the README and the
    description is a cited application; no compared statement asserts it.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    The axioms of every compared declaration were printed, the Challenge and
    Solution statements were checked identical, and the registry comparator
    was run locally under both kernels (BUILD.txt). The statements were fixed
    in advance by a written brief and audited after the build by an
    AI-assisted referee pass under the author's direction; the physics
    docstrings were checked for overstatement (in particular that no
    statement says "su(2)_R is required"). The author read the seven compared
    statements against their descriptions and approved them on 2026-11-05.

