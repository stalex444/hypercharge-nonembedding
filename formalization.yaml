status:
  scope: >-
    Formalized: five compared theorems, in comparator order, namespace
    Hypercharge (see the description for their content), and nine auxiliary
    lemmas in Solution.lean (the three evaluations emb_e01, emb_e12, emb_e20
    of emb on the elementary matrices E_01, E_12, E_20; the traces of Y_uc,
    Y_dc and of rhoR X; the two trace-based inequalities; and
    BminusL_restriction_ne, that no multiple of diag(1,1,1,-3) restricts to
    either hypercharge block). Not formalised: any general theorem (the
    commutant of a Levi subalgebra of sl_n; the trace criterion for the dual
    of a semisimple action; branching rules); any statement about which
    generator (a u(1) or the Cartan element of an su(2)_R) supplies the
    missing T_3R; any statement about the physical world.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

