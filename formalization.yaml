    and corrected one false sentence in this file's fidelity section, the
    missing search record and the provenance configuration before
    submission. The author read the seven compared statements against their
    descriptions in the README table and approved them before submission.

alignment:
  namespace: "Hypercharge"
  statements:
    - source: "Baez-Huerta 2010 section 3.3 (group level: the SU(4) factor alone fails on the right-handed particles); Lie-algebra instance on explicit matrices formalised here, 2026-11-05"
      lean: "Hypercharge.hypercharge_not_in_image"
      module: "Solution"
      status: "proved"
      note: "For all X in gl_4(K), Y in gl_2(K): not (rhoL X Y = Y_L and rhoR X = Y_uc and rhoR X = Y_dc)."
    - source: "Textbook (the U(1) commuting with SU(3) inside SU(4) is diag(alpha, alpha, alpha, alpha^-3): Baez-Huerta 2010 section 3.3; Pati-Salam 1974); Lie-algebra instance formalised here, 2026-11-05"
      lean: "Hypercharge.centralizer_sl3_in_sl4"
      module: "Solution"
      status: "proved"
      note: "Trace-zero X commuting with every traceless colour-block matrix is a multiple of diag(1,1,1,-3)."
    - source: "Elementary; a corollary of Mathlib's Matrix.mem_range_scalar_of_commute_single, proved here by elementary matrices"
      lean: "Hypercharge.centralizer_sl2_trivial"
      module: "Solution"
      status: "proved"
      note: "Trace-zero Y in gl_2 commuting with every traceless 2 x 2 matrix is zero (characteristic zero)."
    - source: "Baez-Huerta 2010 section 3.3 (k = 0 fails on the right-handed particles); Lie-algebra instance formalised here, 2026-11-05"
      lean: "Hypercharge.BminusL_same_scalar_on_conjugate_copies"
      module: "Solution"
      status: "proved"
      note: "No multiple of diag(1,1,1,-3) acts as Y_uc or as Y_dc under rhoR."
    - source: "The textbook relation Y = (1/2)(B - L) + T_3R (Baez-Huerta 2010 section 3.3, k = 3, in their normalisation; Pati-Salam 1974) on this content; formalised here, 2026-11-05"
      lean: "Hypercharge.hypercharge_decomposition"
      module: "Solution"
      status: "proved"
      note: "Y_L = (1/2) BmLL; Y_uc = (1/2) rhoR BmL - (1/2) 1; Y_dc = (1/2) rhoR BmL + (1/2) 1."
    - source: "Arithmetic of a stated formula (the one-loop coefficient of an abelian factor; sourced physics, not proved here)"
      lean: "Hypercharge.u1R_one_loop_coefficient"
      module: "Solution"
      status: "proved"
      note: "-(2/3) (3 (8 (1/2)^2)) = -4 in Q."
    - source: "Baez-Huerta 2010 section 3.3 at the group level; the trace form on each conjugate copy formalised here, 2026-11-05"
      lean: "Hypercharge.hypercharge_not_in_image_on_either_copy"
      module: "Solution"
      status: "proved"
      note: "For every traceless X: rhoR X != Y_uc and rhoR X != Y_dc (trace argument)."

