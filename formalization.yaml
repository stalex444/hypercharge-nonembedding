  reviewers:
    - "Stephanie Alexander"
  notes: >-
    The axioms of every compared declaration were printed, the Challenge and
    Solution statements were checked identical, and the registry comparator
    was run locally under both kernels (BUILD.txt). The statements were fixed
    in advance by a written brief and audited after the build by an
    AI-assisted referee pass under the author's direction; the physics
    docstrings were checked for overstatement (in particular that no
    statement says "su(2)_R is required"); a second pass (a reviewer
    simulation, a prior-formalization search and a calibration gate) found
    and corrected one false sentence in this file's fidelity section, the
    missing search record and the provenance configuration before
    submission; a third pass (a blind editorial reviewer applying the
    registry's rubric, a Lean-side mutation audit, a physics referee, and a
    read of the registry's render pipeline) led to two of the seven original
    compared statements being moved out of the compared set, to the
    recorded mutation tests in fidelity (b), and to attribution corrections
    in the description. The author read the seven original compared
    statements against their descriptions and approved them on 2026-11-05;
    the five compared here are five of those seven, unchanged in statement.

