fidelity:
  divergences: >-
    (a) The Lie algebras enter as matrix spaces: statement 1 is stated for
    ALL X in gl_4 and Y in gl_2 (no tracelessness), which is stronger than the
    sl_4 + sl_2 statement in the title and contains it; statements 2, 3 and 7
    carry trace-zero hypotheses explicitly. (b) The "action" is the explicit
    matrix formula (X, Y) |-> (X (x) 1 + 1 (x) Y, -X^T, -X^T); no Lie-algebra
    structure (brackets, representation axioms) is formalised, because none
    is needed for the statements. (c) The field K is arbitrary with [CharZero K] wherever the recorded proof
    divides by a numeral (statements 1, 3, 4, 5, 7); statement 2 holds over
    any field. For statements 3, 4, 5 and 7 the hypothesis is load-bearing:
    each fails in characteristic 2 (the identity 1_2 is then traceless and
    central; trace Y_uc = -2 vanishes and Y_uc = 0, so X = 0 and a = 0 are
    witnesses; 1/2 = 0 falsifies the Y_dc conjunct of statement 5). For
    statement 1 the hypothesis is used only by the recorded proof, which
    compares the (0,0) entries -2/3 and 1/3 (these coincide when 3 = 0, a
    field's 3^{-1} being 0 there): the lepton entries 0 and 1 of Y_uc and
    Y_dc differ in every field, so the statement itself holds without the
    hypothesis; it is stated here with it. (d)
    Statement 6 is a rational identity in Q, not a statement about any
    gauge theory; the physics formula it instantiates is cited, not proved.
    (e) The commutant statements 2 and 3 quantify over traceless test
    matrices; the proofs instantiate finitely many - the elementary matrices
    E_01, E_12, E_20 for statement 2 and E_01, E_10 for statement 3 - as
    recorded in Solution.lean. (f) The physical reading in the README and the
    description is a cited application; no compared statement asserts it.

