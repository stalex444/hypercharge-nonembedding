# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# A new entry (no prior Palomar registration of this content).
version: "v0.4"

project:
  name: "Hypercharge is not an element of sl(4) + sl(2) acting on (4,2) + (4bar,1) + (4bar,1): the Standard-Model hypercharge on one generation of Pati-Salam content lies outside su(4) + su(2)_L; the commutant of colour in sl(4) is the B - L line; Y = (1/2)(B - L) plus a T_3-type generator"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of seven statements of finite
    linear algebra over a field K (characteristic zero where a numeral must be
    nonzero). This is a kernel-checked instance of textbook representation
    theory (the Pati-Salam decomposition), not a new theorem: the sharpest
    statement is a 4 x 4 trace computation, and the entry's value is that the
    non-embedding, the commutant and the decomposition Y = (1/2)(B - L) + T_3R
    are fixed for exactly this content and normalisation so that they can be
    cited exactly. The Lie algebra gl_4(K) + gl_2(K) acts on V = (K^4 (x) K^2) + K^4
    + K^4 by (X, Y) |-> (X (x) 1 + 1 (x) Y, -X^T, -X^T): the defining
    representation tensored with the defining representation on the first
    summand and the dual of the defining representation of gl_4 on each of the
    two remaining summands, which carry the SAME matrix. This is the
    one-generation Pati-Salam content (4,2) + (4bar,1) + (4bar,1) of
    su(4) + su(2)_L: the left-handed doublets (u, d, nu, e)_L, the conjugate
    up-type copy (u_R, nu_R)^c and the conjugate down-type copy (d_R, e_R)^c,
    colour at indices 0, 1, 2 and the lepton at index 3. The fixed operator is
    the Standard-Model hypercharge, normalisation Q = T_3 + Y: Y_L = diag(1/6,
    1/6, 1/6, -1/2) (x) 1_2, Y_uc = diag(-2/3, -2/3, -2/3, 0), Y_dc = diag(1/3,
    1/3, 1/3, 1). (1) For ALL X in gl_4 and Y in gl_2 (traceless or not): not
    (rhoL X Y = Y_L and rhoR X = Y_uc and rhoR X = Y_dc) - the two conjugate
    copies receive one matrix -X^T and Y_uc != Y_dc. (2) If X in gl_4 has
    trace 0 and commutes with every traceless 3 x 3 matrix embedded in the
    colour block, then X = a diag(1, 1, 1, -3) for some a: the commutant of
    sl_3 in sl_4 is the B - L line (no characteristic assumption). (3) If Y in
    gl_2 has trace 0 and commutes with every traceless 2 x 2 matrix, then
    Y = 0. (4) For every a, rhoR (a diag(1,1,1,-3)) equals neither Y_uc nor
    Y_dc: the commutant acts by one scalar where hypercharge needs two. (5)
    Y_L = (1/2)(B - L) (x) 1, Y_uc = (1/2) rhoR(B - L) - (1/2) 1, Y_dc = (1/2)
    rhoR(B - L) + (1/2) 1, with B - L = diag(1/3, 1/3, 1/3, -1): hypercharge
    is half of B - L plus a generator acting by 0 on the left-handed block and
    by the opposite scalars -1/2, +1/2 on the two right-handed conjugate
    copies. (6) The rational identity -(2/3) (3 (8 (1/2)^2)) = -4: the
    arithmetic of the one-loop coefficient b_0 = -(2/3) sum_Weyl q^2 of an
    abelian gauge factor for eight right-handed Weyl fermions of charge +-1/2
    per generation and three generations; the formula is a stated physics
    input and is not formalised, only its arithmetic. (7) For every traceless
    X in gl_4: rhoR X != Y_uc and rhoR X != Y_dc - each conjugate copy alone
    excludes hypercharge from sl_4, because trace Y_uc = -2, trace Y_dc = 2
    and trace(-X^T) = 0; the two blocks have opposite traces, so the
    obstruction is invisible to the total trace over V and is seen summand by
    summand. Statement 7 is the sharpest form of the non-embedding and needs
    neither the commutant nor the pairing of the copies; statements 2-5
    record the structure behind it. The mathematics is textbook
    representation theory of the Pati-Salam decomposition (Pati-Salam 1974;
    Georgi-Glashow 1974; Slansky 1981): the relation Y = (1/2)(B - L) + T_3R
    and the need for a generator outside su(4) + su(2)_L are standard, and
    the entry claims only the kernel-checked instance for this content, these
    operators and this normalisation. Application (no compared statement
    asserts it): in the author's canon su(3) + su(4) is derived and, given its
    canonical modulus rule, exactly one su(2)_L is forced; no abelian factor
    outside these is derived. The statements locate hypercharge relative to
    that algebra: its B - L half lies inside the derived su(4) (statement 2,
    the colour commutant), while hypercharge as a whole cannot be carried by
    su(4) + su(2)_L on this content (statements 1, 4, 7), so a T_3-type
    generator on right-handed fields must be gauged in addition (statement
    5); whether it is a u(1) or the Cartan element of an su(2)_R is not
    decided by any statement here. The question is live because a
    shepherding committee (Douglas, Gross, Jaffe, Klebanov, Nekrasov; KITP,
    October and November 2026) is preparing the release of a claimed
    existence proof of quantum Yang-Mills theory and, as the larger object,
    of QCD and completions of the Standard Model (the committee's words),
    described by OpenAI as built on gauge fields and fermions in four
    dimensions; the statements here are a constraint any such completion
    whose gauge algebra contains su(4) + su(2)_L must satisfy, not a
    consequence of or support for that proof, whose artifacts are unreleased
    as of 2026-11-05, and nothing is asserted about the content that proof
    actually uses.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.RT / 17B10 (representations of Lie algebras: commutants, the dual
  # representation), 15A30 (algebraic systems of matrices), 20G05 (representation
  # theory for linear algebraic groups: the Pati-Salam decomposition). hep-ph and
  # math-ph / 81R40 (symmetry breaking), 81V22 (unified quantum theories) because
  # the application section states the physical reading as a cited application;
  # no compared statement is a physical claim.
  arxiv: ["math.RT", "hep-ph", "math-ph"]
  msc2020: ["17B10", "15A30", "20G05", "81R40", "81V22"]

sources:
  - title: "The algebra of grand unified theories"
    authors:
      - "John C. Baez"
      - "John Huerta"
    id: "Bulletin of the American Mathematical Society 47 (2010) 483-552"
    # DOI 10.1090/S0273-0979-10-01294-2; arXiv:0904.1556 (v2, 1 May 2010). Section 3.3
    # read 2026-11-05; Crossref-verified.
    type: "article"
    location: "https://doi.org/10.1090/S0273-0979-10-01294-2"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      THE SOURCE THIS ENTRY FORMALISES, in Lie-algebra form on explicit
      matrices. Section 3.3 embeds U(1) x SU(2) x SU(3) into SU(2) x SU(2) x
      SU(4) with the U(1) acting as diag(alpha, alpha, alpha, alpha^-3) in
      SU(4) together with a twist k on the right-handed SU(2), records that
      the SU(4) factor alone (k = 0) gives the wrong right-handed
      hypercharges, and that all hypercharges match for k = 3 (the paper's
      hypercharge is twice this entry's: Q = I_3 + Y/2). Statements 1, 4 and
      7 are the Lie-algebra form of "the SU(4) factor alone fails on the
      right-handed particles"; statement 2 is the commutant that makes
      diag(alpha, alpha, alpha, alpha^-3) the only candidate; statement 5 is
      the relation Y = (1/2)(B - L) + T_3R on this content; statement 3 is
      elementary and statement 6 is arithmetic of a stated formula. The paper
      works at the group level and takes the full Pati-Salam group as given;
      the entry proves the matrix statements for the specific content,
      operators and normalisation named in the description, over a field of
      characteristic zero, and claims nothing beyond that kernel-checked
      instance. No prior formalization of statements 1, 2, 4 or 7 was found in
      the search recorded in README 'Prior art' (2026-11-05: Mathlib at the
      pinned revision 065356127b1d; Physlib master 69f7d2a7, which formalises
      the Standard-Model hypercharge assignments and the B - L and Y charge
      vectors but has the Pati-Salam embedding only as an informal definition
      and no sl_4 statement; the openai/math catalogue at commit 42907c9e of
      2026-10-26; the Palomar registry; Zenodo 10.5281/zenodo.19910097, a
      native_decide table check). Statement 3 is a corollary of Mathlib's
      Matrix.mem_range_scalar_of_commute_single.
    license: "unknown"
  - title: "Lepton number as the fourth 'color'"
    authors:
      - "Jogesh C. Pati"
      - "Abdus Salam"
    id: "Physical Review D 10 (1974) 275-289"
    # DOI 10.1103/PhysRevD.10.275; Crossref-verified 2026-11-05. The original not
    # re-read for this entry; cited from the standard literature.
    type: "article"
    location: "https://doi.org/10.1103/PhysRevD.10.275"
    relationship: "background"
    note: >-
      Background: the su(4) with the lepton as the fourth colour, the content
      (4,2) + (4bar,1) + (4bar,1) under su(4) + su(2)_L (+ su(2)_R in the
      original), and B - L as the traceless generator of su(4) commuting with
      colour, all taken from the standard literature. No statement of the
      paper is a compared statement.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Unity of All Elementary-Particle Forces"
    authors:
      - "Howard Georgi"
      - "Sheldon L. Glashow"
    id: "Physical Review Letters 32 (1974) 438-441"
    # DOI 10.1103/PhysRevLett.32.438; Crossref-verified 2026-11-05.
    type: "article"
    location: "https://doi.org/10.1103/PhysRevLett.32.438"
    relationship: "background"
    note: >-
      Background: the hypercharge assignments and the normalisation Q = T_3 +
      Y used for the fixed operators Y_L, Y_uc, Y_dc, and the observation that
      hypercharge is traceless over a generation. No statement of the paper is
      a compared statement.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Group theory for unified model building"
    authors:
      - "Richard Slansky"
    id: "Physics Reports 79 (1981) 1-128"
    # DOI 10.1016/0370-1573(81)90092-2; Crossref-verified 2026-11-05. The tables
    # cited from the standard literature.
    type: "article"
    location: "https://doi.org/10.1016/0370-1573(81)90092-2"
    relationship: "background"
    note: >-
      Branching rules for SO(10) containing SU(4) x SU(2) x SU(2) (the
      Pati-Salam decomposition) in tabulated form. Background only; the entry
      formalises no table and no statement of the review is a compared
      statement.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Proof by OpenAI of the Existence of Quantum Yang-Mills theory - Statement by the shepherding committee (October 2026) and 2nd Statement (November 3, 2026)"
    authors:
      - "Michael R. Douglas"
      - "David J. Gross"
      - "Arthur Jaffe"
      - "Igor R. Klebanov"
      - "Nikita Nekrasov"
    id: "KITP, Yang-Mills Working Group statements, October 2026 and 2026-11-03"
    # Both PDFs read 2026-11-05 (sha256 recorded in the author's working notes).
    type: "web post"
    location: "https://www.kitp.ucsb.edu/statement-by-the-yangmills-working-group"
    relationship: "background"
    note: >-
      CONTEXT ONLY; no mathematical statement is taken from these documents
      and none of them supports or is supported by any compared statement.
      The committee holds custody of a claimed existence proof, produced by an
      OpenAI model, of quantum Yang-Mills theory "including coupling to
      fermions" (first statement), is checking "the Lean proof of the
      existence of pure Yang-Mills theory" for release (second statement), and
      the KITP working-group page names as the larger object the existence of
      QCD and "completions of the Standard Model". The committee states that
      "confinement and the mass gap remain very important open challenges".
      The present entry is a constraint on any such completion whose gauge
      algebra contains su(4) + su(2)_L acting on the one-generation Pati-Salam
      content: there, hypercharge requires a generator outside that algebra.
      Nothing is asserted about the content the announced proof actually
      uses. The artifacts are unreleased as of 2026-11-05; the entry cites the
      committee's own words, and the KITP page's phrase, for the scope of
      their claim and nothing else.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Building scientific understanding with academic communities (OpenAI announcement, 2026-10-26)"
    authors:
      - "OpenAI"
    id: "openai.com/index/building-scientific-understanding-with-academic-communities/"
    # Read in a browser 2026-10-26 (the site refuses automated fetch); the physics
    # paragraph was transcribed verbatim into the author's working notes.
    type: "web post"
    location: "https://openai.com/index/building-scientific-understanding-with-academic-communities/"
    relationship: "background"
    note: >-
      CONTEXT ONLY. The announcement describes "a mathematically rigorous
      existence proof of certain interacting quantum field theories containing
      gauge fields and fermions in four dimensions, including Quantum
      Chromodynamics (QCD) and a unified completion of the Standard Model of
      particle physics", built "on Balaban's approach in constructive quantum
      field theory". The gauge group and representation content of the
      "unified completion" are not named publicly. The statements of this
      entry are a constraint on any such completion whose gauge algebra
      contains su(4) + su(2)_L acting on the one-generation Pati-Salam
      content; they are not derived from, and do not bear on the correctness
      of, the announced proof.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4 (Matrix, Matrix.kroneckerMap / ⊗ₖ, Matrix.diagonal, Matrix.trace, Matrix.transpose, Fin)"
    relationship: "builds-on"
    note: >-
      The compared statements use Mathlib's matrix vocabulary plus nine
      definitions in Challenge.lean (rhoL, rhoR, emb, YL, Yuc, Ydc, BmL, BmLL,
      D), repeated verbatim in Solution.lean. Mathlib at the pin has no
      Pati-Salam, hypercharge or Standard-Model content; statement 3 is a
      corollary of Mathlib's Matrix.mem_range_scalar_of_commute_single, proved
      here by elementary matrices so that statements 2 and 3 read alike.
  - id: "https://github.com/leanprover-community/physlib (formerly HEPLean/PhysLean), master 69f7d2a75fabdb848683f8141b4ce718e71e446b, read 2026-11-05"
    relationship: "other"
    note: >-
      Independent and not used. Physlib formalises the Standard-Model hypercharge
      assignments as representations of SU(3) x SU(2) x U(1) on each fermion species
      (Physlib.Particles.StandardModel.Fermions.*, e.g. UpSinglet.repGaugeGroupI with
      U(1) exponent 4, LeptonDoublet.repGaugeGroupI with exponent -3) and proves the
      hypercharge and B - L charge vectors SMRHN.PlusU1.Y1 = (1,-4,2,-3,6,0),
      SMRHN.PlusU1.BL1 = (1,-1,-1,-3,3,3) anomaly-free; its Pati-Salam module has the
      embedding SU(3) x SU(2) x U(1) -> SU(4) x SU(2) x SU(2), (h, g, alpha) |->
      (blockdiag(alpha h, alpha^-3), g, diag(alpha^3, alpha^-3)), only as an
      informal_definition (PatiSalam.inclSM; no Lean term, no theorem). It has no
      declaration about an sl_4 action, the commutant of sl_3 in sl_4, the dual-
      representation trace, or hypercharge lying outside su(4) + su(2)_L. No module is
      shared with this entry.
  - id: "Zenodo record 10.5281/zenodo.19910097 (anonymous, 2026-04-29; by its own description unreviewed and written by an AI model as primary author)"
    relationship: "other"
    note: >-
      Examined and not used: its MetricOrigin/Hypercharge.lean defines hypercharge as
      (B - L)/2 + T_3R on a sixteen-row data table and checks Q = T_3L + Y by
      native_decide; no Lie algebra, no action and no non-embedding statement. Not a
