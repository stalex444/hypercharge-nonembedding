status:
  scope: >-
    Formalized: seven compared theorems, in comparator order, namespace
    Hypercharge (see the description for their content), and eight auxiliary
    lemmas in Solution.lean (the three elementary-matrix commutation
    identities, the traces of Y_uc, Y_dc and of rhoR X, and the two
    trace-based inequalities). Not formalised: any general theorem (the
    commutant of a Levi subalgebra of sl_n; the trace criterion for the dual
    of a semisimple action; branching rules); the one-loop formula behind
    statement 6 (only its arithmetic); any statement about which generator
    (a u(1) or the Cartan element of an su(2)_R) supplies the missing T_3R;
    any statement about the physical world.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

